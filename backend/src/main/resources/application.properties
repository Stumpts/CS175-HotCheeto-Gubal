spring.application.name=gubal

# Import git-ignored local.properties so secrets are not committed
spring.config.import=optional:file:./local.properties,optional:file:../local.properties

# Database Connection URL, Username, and Password
spring.datasource.url=jdbc:postgresql://localhost:5432/devdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# 'update' automatically applies entity schema changes to existing tables
spring.jpa.hibernate.ddl-auto=update

# Optional: Log executed SQL statements to the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true